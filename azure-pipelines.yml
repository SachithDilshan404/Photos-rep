stages:
- stage: setup
  jobs:
  - job: windows_setup
    pool:
      vmImage: 'windows-2025'
    timeoutInMinutes: 9999
    steps:

    - powershell: |
        Write-Host "Installing ngrok via Chocolatey..."
        choco install ngrok.portable -y
        Refresh-Env  # if environment refresh needed

        ngrok config add-authtoken $Env:NGROK_AUTH_TOKEN
      displayName: 'Install and configure ngrok via Chocolatey'

    - powershell: |
        # Configure Remote Desktop
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
      displayName: 'Configure Remote Desktop'

    - powershell: |
        # Create User runneradmin …
        # (your existing user-creation script)
      displayName: 'Create User runneradmin'

    - powershell: |
        ngrok tcp 3389
      displayName: 'Run ngrok for RDP'
